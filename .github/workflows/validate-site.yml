name: Validate literature review data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data and interface hooks
        run: python tools/validate_site.py
      - name: Test automatic asset versioning
        run: python -m unittest discover -s tools -p "test_*.py"
      # Push/PR commits may contain content edits only. The stamp workflow saves
      # generated URLs on main; validate the same generated result in this checkout.
      - name: Generate asset versions for content edits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python tools/stamp_assets.py
      - name: Check asset stamps are current
        run: python tools/stamp_assets.py --check

  source-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source links
        run: python tools/check_links.py
